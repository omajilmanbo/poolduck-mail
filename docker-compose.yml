name: poolduck-mail-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: poolduck-mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poolduck_mail}
      POSTGRES_USER: ${POSTGRES_USER:-poolduck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poolduck_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: poolduck-mail-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-poolduck}:${POSTGRES_PASSWORD:-poolduck_local_password}@postgres:5432/${POSTGRES_DB:-poolduck_mail}
      JWT_SECRET: local_dev_only_change_me
      REFRESH_TOKEN_SECRET: local_refresh_dev_only_change_me
      MAIL_PROVIDER: mock
      MAIL_FROM_ADDRESS: no-reply@example.local
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:3000
      TENANT_CONTEXT_ENFORCED: "true"
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: poolduck-mail-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      API_BASE_URL: http://backend:3001
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
