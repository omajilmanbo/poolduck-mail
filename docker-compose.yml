name: poolduck-mail-local

services:
  postgres:
    image: postgres:16
    container_name: poolduck-mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poolduck_mail}
      POSTGRES_USER: ${POSTGRES_USER:-poolduck_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poolduck_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poolduck-mail-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-poolduck_local}:${POSTGRES_PASSWORD:-poolduck_local_password}@postgres:5432/${POSTGRES_DB:-poolduck_mail}
      JWT_SECRET: ${JWT_SECRET:-please_change_me}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-86400}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-please_change_me}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mock}
      MAIL_MOCK_SEND_RESULT: ${MAIL_MOCK_SEND_RESULT:-success}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.local}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      TENANT_CONTEXT_ENFORCED: ${TENANT_CONTEXT_ENFORCED:-true}
      API_BASE_URL: http://127.0.0.1:3001
    ports:
      - "${APP_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    container_name: poolduck-mail-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
