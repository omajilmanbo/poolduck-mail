name: poolduck-mail-local

services:
  postgres:
    image: postgres:16
    container_name: poolduck-mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poolduck_mail}
      POSTGRES_USER: ${POSTGRES_USER:-poolduck_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poolduck_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
