name: Task
description: Documentation, preparation, and configuration tasks
labels: ["type:task"]
body:
  - type: textarea
    id: background
    attributes:
      label: background
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: task scope
      placeholder: |
        - will do
        - do nothing
    validations:
      required: true
  - type: textarea
    id: human_prerequisites
    attributes:
      label: Human prerequisites / external prerequisites
      description: The account, permissions, environment, port, domain name, database, Secrets or external services prepared manually in advance must be clearly specified; if not required, please write "None".
      placeholder: |
        - Requires manual preparation:
        - Agent is not responsible for:
        - If none, fill in: none
    validations:
      required: true
  - type: textarea
    id: agent_permissions_runtime
    attributes:
      label: Agent permissions and execution environment (Agent permissions / runtime)
      description: Clarify the repository permissions, network, Docker, GitHub Actions, cloud platform or other execution environment requirements required by the Agent to run the task.
      placeholder: |
        - Repository write permission: required / not required
        - network access / npm install: required / not required
        - Docker: required / not required
        - GitHub Actions permissions: required / not required
        - Cloud platform permissions: required / not required
    validations:
      required: true
  - type: textarea
    id: blocking_conditions
    attributes:
      label: blocking conditions / stopping rules (Blocking conditions)
      description: In the absence of permissions, environments, Secrets, cloud resources, or manual confirmation, the Agent must stop and report, and must not pretend to be complete.
      placeholder: |
        - Must stop when the following conditions are missing:
        - After stopping, report to:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: acceptance criteria
      placeholder: |
        - [ ] Condition 1
        - [ ] Condition 2
    validations:
      required: true
  - type: dropdown
    id: role_label
    attributes:
      label: role label
      options:
        - role:backend
        - role:frontend
        - role:architect
        - role:devops
        - role:qa
    validations:
      required: true

  - type: checkboxes
    id: ssot_check
    attributes:
      label: SSOT consistency check
      description: If the requirement involves the following baselines, please cite the relevant documents simultaneously in the description (README/docs/api.md/docs/database.md/docs/requirements.md)
      options:
        - label: role remains root_admin / manager
        - label: The subscription status is still trial / active / expired / suspended
        - label: The login process is still tenant_id + email + password
        - label: The body of the scanned email is still the back-end fixed template (custom_message/custom_text/mail_body is not accepted)
