name: Task
about: 文档、准备、配置类任务
labels: ["type:task"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 任务范围
      placeholder: |
        - 将要做
        - 不做什么
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 条件 1
        - [ ] 条件 2
    validations:
      required: true
  - type: dropdown
    id: role_label
    attributes:
      label: 角色标签
      options:
        - role:backend
        - role:frontend
        - role:architect
        - role:devops
        - role:qa
    validations:
      required: true

  - type: checkboxes
    id: ssot_check
    attributes:
      label: SSOT 一致性检查
      description: 如需求涉及以下基线，请在说明中同步引用相关文档（README/docs/api.md/docs/database.md/docs/requirements.md）
      options:
        - label: 角色仍为 root_admin / manager
        - label: 订阅状态仍为 trial / active / expired / suspended
        - label: 登录流程仍为 tenant_id + email + password
        - label: 扫码邮件正文仍为后端固定模板（不接收 custom_message/custom_text/mail_body）
