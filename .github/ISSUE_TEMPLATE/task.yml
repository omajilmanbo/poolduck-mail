name: Task
description: 提出一个文档、配置、准备或工程任务
labels: ["type:task"]
body:
  - type: textarea
    id: summary_scope
    attributes:
      label: 任务与范围
      description: 用几条简短要点说明目标、要做什么，以及不做什么。
      placeholder: |
        目标：
        - …
        范围：
        - …
        不做：
        - …
    validations:
      required: true
  - type: textarea
    id: acceptance_tests
    attributes:
      label: 完成条件与验证
      description: 列出完成标准、验证命令或人工检查项。
      placeholder: |
        - [ ] 完成条件…
        - [ ] 验证：…
    validations:
      required: true
  - type: textarea
    id: decisions_blockers
    attributes:
      label: 待确认 / 外部前提（可选）
      description: 仅在依赖人工决策、账号权限、Secrets、外部服务或特定环境时填写；没有则留空。缺少必要前提时 Agent 应停止并在评论说明。
      placeholder: |
        - 需要确认：…
        - 外部前提：…
        - 阻塞时：在 Issue 评论报告
    validations:
      required: false
  - type: dropdown
    id: role_label
    attributes:
      label: 主要角色
      options:
        - role:backend
        - role:frontend
        - role:architect
        - role:devops
        - role:test
        - role:docs
    validations:
      required: true
  - type: checkboxes
    id: risk_labels
    attributes:
      label: 风险（按需选择）
      options:
        - label: risk:auth
        - label: risk:billing
        - label: risk:data
        - label: risk:migration
