name: Feature
about: 新功能需求模板
labels: ["type:feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 说明该需求出现的业务背景与价值
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰描述需要实现的功能
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 请用可验证的条目描述完成标准
      placeholder: |
        - [ ] 标准 1
        - [ ] 标准 2
    validations:
      required: true
  - type: dropdown
    id: role_label
    attributes:
      label: 角色标签
      options:
        - role:backend
        - role:frontend
        - role:architect
        - role:fullstack
    validations:
      required: true
  - type: checkboxes
    id: risk_labels
    attributes:
      label: 风险标签
      options:
        - label: risk:auth
        - label: risk:billing
        - label: risk:data
        - label: risk:migration
        - label: risk:security
