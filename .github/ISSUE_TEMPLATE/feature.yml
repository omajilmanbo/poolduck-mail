name: Feature
about: 新功能需求模板
labels: ["type:feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 说明该需求出现的业务背景与价值
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 清晰描述需要实现的功能
    validations:
      required: true
  - type: textarea
    id: human_prerequisites
    attributes:
      label: 人工准备 / 外部前提（Human prerequisites）
      description: 必须明确人工提前准备的账号、权限、环境、端口、域名、数据库、Secrets 或外部服务；如果不需要请写“无”。
      placeholder: |
        - 需要人工准备：
        - Agent 不负责：
        - 无则填写：无
    validations:
      required: true
  - type: textarea
    id: agent_permissions_runtime
    attributes:
      label: Agent 权限与执行环境（Agent permissions / runtime）
      description: 明确 Agent 运行该需求所需的仓库权限、网络、Docker、GitHub Actions、云平台或其他执行环境要求。
      placeholder: |
        - 仓库写权限：需要 / 不需要
        - 网络访问 / npm install：需要 / 不需要
        - Docker：需要 / 不需要
        - GitHub Actions 权限：需要 / 不需要
        - 云平台权限：需要 / 不需要
    validations:
      required: true
  - type: textarea
    id: blocking_conditions
    attributes:
      label: 阻塞条件 / 停止规则（Blocking conditions）
      description: 如缺少权限、环境、Secrets、云资源或人工确认，Agent 必须停止并报告，不得假装完成。
      placeholder: |
        - 缺少以下条件时必须停止：
        - 停止后需报告给：
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 请用可验证的条目描述完成标准
      placeholder: |
        - [ ] 标准 1
        - [ ] 标准 2
    validations:
      required: true
  - type: dropdown
    id: role_label
    attributes:
      label: 角色标签
      options:
        - role:backend
        - role:frontend
        - role:architect
        - role:fullstack
    validations:
      required: true
  - type: checkboxes
    id: risk_labels
    attributes:
      label: 风险标签
      options:
        - label: risk:auth
        - label: risk:billing
        - label: risk:data
        - label: risk:migration
        - label: risk:security

  - type: checkboxes
    id: ssot_check
    attributes:
      label: SSOT 一致性检查
      description: 如需求涉及以下基线，请在说明中同步引用相关文档（README/docs/api.md/docs/database.md/docs/requirements.md）
      options:
        - label: 角色仍为 root_admin / manager
        - label: 订阅状态仍为 trial / active / expired / suspended
        - label: 登录流程仍为 tenant_id + email + password
        - label: 扫码邮件正文仍为后端固定模板（不接收 custom_message/custom_text/mail_body）
