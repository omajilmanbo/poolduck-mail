name: Feature
description: 提出一个可独立实施的功能需求
labels: ["type:feature"]
body:
  - type: textarea
    id: summary_scope
    attributes:
      label: 目标与范围
      description: 用几条简短要点说明要解决什么、为什么需要，以及本 Issue 不做什么。
      placeholder: |
        目标：
        - …
        范围：
        - …
        不做：
        - …
    validations:
      required: true
  - type: textarea
    id: acceptance_tests
    attributes:
      label: 验收与测试
      description: 列出可验证的完成条件，以及需要执行的测试。
      placeholder: |
        - [ ] 验收条件…
        - [ ] 测试：…
    validations:
      required: true
  - type: textarea
    id: decisions_blockers
    attributes:
      label: 待确认 / 外部前提（可选）
      description: 仅在依赖人工决策、账号权限、Secrets、外部服务或特定环境时填写；没有则留空。缺少必要前提时 Agent 应停止并在评论说明。
      placeholder: |
        - 需要确认：…
        - 外部前提：…
        - 阻塞时：在 Issue 评论报告
    validations:
      required: false
  - type: dropdown
    id: role_label
    attributes:
      label: 主要角色
      options:
        - role:backend
        - role:frontend
        - role:architect
        - role:devops
        - role:test
    validations:
      required: true
  - type: checkboxes
    id: risk_labels
    attributes:
      label: 风险（按需选择）
      options:
        - label: risk:auth
        - label: risk:billing
        - label: risk:data
        - label: risk:migration
