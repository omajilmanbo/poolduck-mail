name: Bug
about: 缺陷反馈模板
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 按顺序列出可稳定复现问题的步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本信息
      placeholder: 例如 v0.1.0 / commit sha / 环境
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 受影响租户、用户角色、接口或页面
    validations:
      required: true
