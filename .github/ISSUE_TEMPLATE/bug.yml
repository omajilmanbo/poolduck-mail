name: Bug
description: 报告一个可复现的缺陷
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 问题与复现
      description: 简要说明问题、稳定复现步骤和实际结果。
      placeholder: |
        问题：
        步骤：
        1. …
        实际结果：…
    validations:
      required: true
  - type: textarea
    id: expected_impact
    attributes:
      label: 预期与影响
      description: 说明期望结果、受影响用户/接口/页面，以及可接受的修复结果。
      placeholder: |
        预期：…
        影响：…
    validations:
      required: true
  - type: textarea
    id: environment_blockers
    attributes:
      label: 环境 / 外部前提（可选）
      description: 仅在复现或修复依赖特定权限、环境、Secrets、数据库、端口、域名或外部服务时填写。
      placeholder: |
        环境：…
        外部前提：…
    validations:
      required: false
  - type: checkboxes
    id: risk_labels
    attributes:
      label: 风险（按需选择）
      options:
        - label: risk:auth
        - label: risk:billing
        - label: risk:data
        - label: risk:migration
