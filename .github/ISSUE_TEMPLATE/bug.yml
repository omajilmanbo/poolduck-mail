name: Bug
description: Defect feedback template
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: steps to reproduce
      description: List the steps in order to reproduce the problem stably
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: actual behavior
    validations:
      required: true
  - type: textarea
    id: human_prerequisites
    attributes:
      label: Human prerequisites / external prerequisites
      description: If the problem reproduction or fix depends on specific permissions, environment, Secrets, databases, ports, domain names or external services, please specify; if not, please write "None".
      placeholder: |
        - Labor needs to be prepared first:
        - Agent is not responsible for:
        - If none, fill in: none
    validations:
      required: true
  - type: textarea
    id: agent_permissions_runtime
    attributes:
      label: Agent permissions and execution environment (Agent permissions / runtime)
      description: Clarify the permissions and execution environment (repository, network, Docker, Actions, cloud platform, etc.) required for the Agent to debug and fix the bug.
      placeholder: |
        - Repository write permission: required / not required
        - Internet access: required / not required
        - Docker: required / not required
        - Cloud platform permissions: required / not required
    validations:
      required: true
  - type: textarea
    id: blocking_conditions
    attributes:
      label: blocking conditions / stopping rules (Blocking conditions)
      description: In the absence of permissions, environments, Secrets, cloud resources, or manual confirmation, the Agent must stop and report, and must not pretend to be complete.
      placeholder: |
        - Must stop when the following conditions are missing:
        - After stopping, report to:
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: version information
      placeholder: e.g. v0.1.0/commit sha/environment
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: scope of influence
      description: Affected tenant, user role, interface or page
    validations:
      required: true
