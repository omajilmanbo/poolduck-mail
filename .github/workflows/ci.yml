name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: Critical E2E (${{ matrix.mail_result }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - mail_result: success
            expected_status: sent
          - mail_result: failure
            expected_status: queued
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poolduck
          POSTGRES_PASSWORD: poolduck_ci
          POSTGRES_DB: poolduck_mail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poolduck -d poolduck_mail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://poolduck:poolduck_ci@localhost:5432/poolduck_mail?schema=public
      JWT_SECRET: ci-synthetic-jwt-secret
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      MAIL_MOCK_SEND_RESULT: ${{ matrix.mail_result }}
      E2E_EXPECT_MAIL_STATUS: ${{ matrix.expected_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend and prepare synthetic database
        run: |
          npm --prefix backend ci
          npm --prefix backend run db:deploy
          npm --prefix backend run local:seed

      - name: Install frontend and Chromium
        run: |
          npm --prefix frontend ci
          npx --prefix frontend playwright install --with-deps chromium

      - name: Start application
        run: |
          npm --prefix backend run start:dev > backend-e2e.log 2>&1 &
          npm --prefix frontend run dev > frontend-e2e.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/health >/dev/null && curl --fail --silent http://localhost:3000/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run critical E2E
        run: npm --prefix frontend run test:e2e

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.mail_result }}
          if-no-files-found: ignore
          path: |
            frontend/test-results
            backend-e2e.log
            frontend-e2e.log
