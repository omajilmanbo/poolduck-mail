name: poolduck-mail-staging

services:
  backend:
    environment:
      OCI_MAIL_APP_ALERTS_ENABLED: ${OCI_MAIL_APP_ALERTS_ENABLED:-true}
      OCI_MONITORING_REGION: ${OCI_MONITORING_REGION:-ap-tokyo-1}
      OCI_MONITORING_COMPARTMENT_ID: ${OCI_MONITORING_COMPARTMENT_ID:-ocid1.compartment.oc1..aaaaaaaaozodhl7uv5suytbn4ef5nyanoo2msdlwp3kk7vnddjadc6ijv3jq}

  reverse-proxy:
    image: caddy:2.11.4-alpine
    container_name: poolduck-mail-staging-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/staging/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  caddy-data:
  caddy-config:
