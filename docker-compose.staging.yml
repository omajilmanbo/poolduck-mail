name: poolduck-mail-staging

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: poolduck-mail-staging-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 && wget -qO- http://127.0.0.1/health >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
